<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#facc15" stroke-opacity="0.25" stroke-width="4" />

  <!-- Big Smiling Laughing Face -->
  <!-- Left Eye: Curved Winking / Laughing Arc -->
  <path d="M 148 210 Q 188 160 228 210" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" />

  <!-- Right Eye: Curved Laughing Arc -->
  <path d="M 284 210 Q 324 160 364 210" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" />

  <!-- Joyful Wide Smile -->
  <path d="M 148 270 Q 256 420 364 270" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" />

  <!-- Tongue / inner warmth -->
  <path d="M 210 326 Q 256 380 302 326 Q 256 348 210 326 Z" fill="#f43f5e" />

  <!-- Sparkle Star in top right -->
  <path d="M 400 110 Q 400 140 430 140 Q 400 140 400 170 Q 400 140 370 140 Q 400 140 400 110 Z" fill="#fde047" />
</svg>
